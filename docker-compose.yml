services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: customerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d customerdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s  # Gives Postgres 15s grace time during initial setup

  # Spring Boot REST API Service
  api:
    image: bilal998/maven-app:latest
    container_name: springapi-container
    restart: always
    ports:
      - "8081:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: customerdb
      DB_USER: postgres
      DB_PASS: secretpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: