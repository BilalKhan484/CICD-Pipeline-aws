<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #0b0f19;
        --card-bg: rgba(30, 41, 59, 0.4);
        --card-border: rgba(255, 255, 255, 0.08);
        --accent-primary: #6366f1;
        --accent-secondary: #8b5cf6;
        --accent-gradient: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
        --text-color: #f1f5f9;
        --text-muted: #94a3b8;
        --border-color: rgba(148, 163, 184, 0.2);
        --input-bg: rgba(15, 23, 42, 0.6);
        --success-color: #10b981;
        --error-color: #f87171;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        background-image: 
          radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%),
          radial-gradient(at 0% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
        background-attachment: fixed;
        color: var(--text-color);
        margin: 0;
        padding: 2rem;
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }

      .container {
        max-width: 900px;
        width: 100%;
        animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      header {
        margin-bottom: 2.5rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      p.subtitle {
        margin: 0.75rem 0 0 0;
        color: var(--text-muted);
        font-size: 0.95rem;
        font-weight: 400;
        display: inline-block;
        background: rgba(255, 255, 255, 0.05);
        padding: 0.4rem 1rem;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      }

      .card:hover {
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.35);
      }

      .card h3 {
        margin-top: 0;
        margin-bottom: 1.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--text-color);
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }

      .card h3 svg {
        color: var(--accent-secondary);
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.25rem;
        margin-bottom: 1.5rem;
      }

      input {
        width: 100%;
        background-color: var(--input-bg);
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 0.9rem 1.25rem;
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: inherit;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-sizing: border-box;
      }

      input::placeholder {
        color: var(--text-muted);
        opacity: 0.7;
      }

      input:focus {
        outline: none;
        border-color: var(--accent-secondary);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.15);
        background-color: rgba(15, 23, 42, 0.9);
      }

      button {
        background: var(--accent-gradient);
        color: #ffffff;
        font-weight: 600;
        border: none;
        padding: 1rem 2rem;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-size: 1rem;
        letter-spacing: 0.02em;
        box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        width: 100%;
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s ease;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
      }

      button:hover::before {
        left: 100%;
      }

      button:active {
        transform: translateY(0);
      }

      .table-container {
        overflow-x: auto;
        border-radius: 16px;
        border: 1px solid var(--card-border);
        background: rgba(15, 23, 42, 0.3);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0;
      }

      th, td {
        text-align: left;
        padding: 1.25rem 1.5rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      }

      th {
        background-color: rgba(15, 23, 42, 0.5);
        color: var(--text-muted);
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      tr:last-child td {
        border-bottom: none;
      }

      tbody tr {
        transition: background-color 0.2s ease;
      }

      tbody tr:hover {
        background-color: rgba(99, 102, 241, 0.08);
      }

      .badge {
        background: rgba(99, 102, 241, 0.15);
        color: #a5b4fc;
        padding: 0.4rem 0.85rem;
        border-radius: 20px;
        font-family: 'Inter', monospace;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid rgba(99, 102, 241, 0.2);
        display: inline-block;
      }

      .empty-state {
        text-align: center;
        padding: 2.5rem;
        color: var(--text-muted);
        font-style: italic;
        font-size: 0.95rem;
      }

      @media (max-width: 640px) {
        body {
          padding: 1rem;
        }
        .card {
          padding: 1.5rem;
        }
        th, td {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Customer Management Portal</h1>
        <p class="subtitle">Spring Boot + Docker Microservice</p>
      </header>

      <!-- Create Customer Form -->
      <div class="card">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          Add New Customer
        </h3>
        <form id="customerForm">
          <div class="form-grid">
            <input
              type="text"
              id="custId"
              placeholder="Customer ID (e.g. 101)"
              required
            />
            <input type="text" id="custName" placeholder="Full Name" required />
            <input
              type="email"
              id="custEmail"
              placeholder="Email Address"
              required
            />
          </div>
          <button type="submit">Create Customer</button>
        </form>
      </div>

      <!-- Customer List Table -->
      <div class="card">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Customer Directory
        </h3>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="customerTableBody">
              <!-- Data populated dynamically via Fetch API -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "/customers";

      // Fetch and display customers on page load
      async function loadCustomers() {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) throw new Error("Network response was not ok");
          
          const customers = await response.json();
          const tableBody = document.getElementById("customerTableBody");

          if (!customers || customers.length === 0) {
            tableBody.innerHTML = `
              <tr>
                <td colspan="3" class="empty-state">No customers found. Add your first customer above!</td>
              </tr>
            `;
            return;
          }

          tableBody.innerHTML = customers
            .map(
              (cust) => `
                <tr>
                    <td><span class="badge">#${cust.id}</span></td>
                    <td style="font-weight: 500; color: #f1f5f9;">${cust.name}</td>
                    <td style="color: #94a3b8;">${cust.email}</td>
                </tr>
            `
            )
            .join("");
        } catch (error) {
          console.error("Error fetching customers:", error);
          const tableBody = document.getElementById("customerTableBody");
          tableBody.innerHTML = `
            <tr>
              <td colspan="3" class="empty-state" style="color: var(--error-color);">Failed to load customers. Please check the server connection.</td>
            </tr>
          `;
        }
      }

      // Submit new customer via POST request
      document
        .getElementById("customerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const submitBtn = e.target.querySelector("button");
          const originalText = submitBtn.innerText;
          
          // Add loading state
          submitBtn.innerText = "Creating...";
          submitBtn.disabled = true;
          submitBtn.style.opacity = "0.7";

          const customerData = {
            id: document.getElementById("custId").value,
            name: document.getElementById("custName").value,
            email: document.getElementById("custEmail").value,
          };

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(customerData),
            });

            if (response.ok) {
              document.getElementById("customerForm").reset();
              loadCustomers(); // Refresh table
            } else {
              alert("Failed to create customer. Please try again.");
            }
          } catch (error) {
            console.error("Error creating customer:", error);
            alert("An error occurred. Please check your connection.");
          } finally {
            // Reset button state
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;
            submitBtn.style.opacity = "1";
          }
        });

      // Initial Load
      loadCustomers();
    </script>
  </body>
</html>
